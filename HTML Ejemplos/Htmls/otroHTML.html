<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo inicial para trabajar con flex</title>
    <style>
        main {
            margin: 0 auto;
            border: 4px solid;
            width: 800px;
            height: 800px;
            background-color: lightgrey;
            display: flex;
            flex-direction: row; 
            justify-content: center;
            align-items: center;
            /* flex-wrap: wrap; */
            gap:10px;
            row-gap: 10px;
            column-gap: 20px;
            
            /* flex-flow: row wrap; */
            /* align-content: center; */
        }

        /* column:  <!--(y,x)--> */
        /* row:  <!--(x,y)--> */

        .primer-contenedor {
            width: 200px;
            height: 200px;
            border: 2px solid;
        }

        #contenedor1 {
            border: 2px solid red;
            order:-5;
            flex-shrink: 2;
            align-self: flex-start;
        }
        
        #contenedor2{
            border: 2px solid green;
            order: 4;
        } 
        
        #contenedor3 { 
            border: 2px solid rgb(28, 28, 216); 
            order: 3;
        }
        
        #contenedor4{
            order: 2;
            align-self: flex-start;
            
        }
        #contenedor5{
            order: -1;
            
        }
        #contenedor6{
            order: 6;
            align-self: flex-start;

        }

    </style>
</head>
<body>
    <!-- Ejemplo flex -->
    <main>
        <div id="contenedor1" class="primer-contenedor">Contenedor 1</div>
        <div id="contenedor2" class="primer-contenedor">Contenedor 2</div>
        <div id="contenedor3" class="primer-contenedor">Contenedor 3</div>

        
        <div id="contenedor4" class="primer-contenedor">Contenedor 4</div>
        <div id="contenedor5" class="primer-contenedor">Contenedor 5</div>
        <div id="contenedor6" class="primer-contenedor">Contenedor 6</div>
    
    </main>
</body>
</html>
